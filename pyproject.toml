[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-overlay-switch"
version = "0.1.0"
description = "Switch a running vLLM server between a model's base weights and a weight overlay in about two seconds, in place, without reloading the model"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
# torch, vLLM and the B12X kernels come from the engine image this is installed into
dependencies = []

[project.entry-points."vllm.endpoint_plugins"]
overlay_switch = "vllm_overlay_switch.api:OverlaySwitchEndpointPlugin"

[tool.setuptools.packages.find]
where = ["mod"]
include = ["vllm_overlay_switch*"]
